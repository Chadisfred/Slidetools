<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<title>Slide Tools</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link rel="stylesheet" href="css/panel.css?v=3.3.0">
</head>
<body>
<div class="topbar">
  <h1>Slide Tools</h1>
  <span class="pill" id="selPill">Nothing selected</span>
  <button class="icon-btn" id="repeatBtn" title="Repeat the last action" aria-label="Repeat the last action" disabled>
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M13 2.5v3h-3"/></svg>
  </button>
  <button class="icon-btn" id="settingsBtn" title="Show, hide and arrange tools, and other settings" aria-label="Panel settings">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4h7M13 4h1M2 8h2M8 8h6M2 12h8M14 12h0"/><circle cx="11" cy="4" r="1.6"/><circle cx="6" cy="8" r="1.6"/><circle cx="12" cy="12" r="1.6"/></svg>
  </button>
</div>

<div class="wrap">
  <div class="banner" id="banner" hidden></div>
  <nav class="launcher" id="launcher" aria-label="Tools"></nav>
  <div id="stack" style="display:grid;gap:8px"></div>
  <div class="empty-note" id="emptyNote" hidden>All tools are hidden. Use the button at the top right to show them.</div>
</div>

<div class="toast" id="toast"></div>

<!-- Load order matters: core, then the panel framework, then each tool, then the starter. -->
<script src="js/core.js?v=3.3.0" defer></script>
<script src="js/panels.js?v=3.3.0" defer></script>
<script src="js/rebuild.js?v=3.3.0" defer></script>
<script src="js/animcore.js?v=3.3.0" defer></script>
<script src="js/crop.js?v=3.3.0" defer></script>
<script src="js/share.js?v=3.3.0" defer></script>
<script src="js/clone.js?v=3.3.0" defer></script>
<script src="js/shortcuts.js?v=3.3.0" defer></script>
<script src="js/update.js?v=3.3.0" defer></script>
<script src="js/tools/snap.js?v=3.3.0" defer></script>
<script src="js/tools/layout.js?v=3.3.0" defer></script>
<script src="js/tools/resize.js?v=3.3.0" defer></script>
<script src="js/tools/copies.js?v=3.3.0" defer></script>
<script src="js/tools/animate.js?v=3.3.0" defer></script>
<script src="js/tools/images.js?v=3.3.0" defer></script>
<script src="js/tools/typography.js?v=3.3.0" defer></script>
<script src="js/tools/corners.js?v=3.3.0" defer></script>
<script src="js/tools/arrange.js?v=3.3.0" defer></script>
<script src="js/tools/match.js?v=3.3.0" defer></script>
<script src="js/tools/styles.js?v=3.3.0" defer></script>
<script src="js/tools/shapestyles.js?v=3.3.0" defer></script>
<script src="js/tools/tables.js?v=3.3.0" defer></script>
<script src="js/tools/colours.js?v=3.3.0" defer></script>
<script src="js/app.js?v=3.3.0" defer></script>
</body>
</html>
